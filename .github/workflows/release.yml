name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        env:
          MOD_VERSION: ${{ github.ref_name }}
        run: ./gradlew build

      - name: Read annotated tag notes
        id: tag
        run: |
          notes=""
          if [ "$(git cat-file -t "refs/tags/${GITHUB_REF_NAME}" 2>/dev/null)" = "tag" ]; then
            notes="$(git for-each-ref --format='%(contents)' "refs/tags/${GITHUB_REF_NAME}")"
          fi
          {
            echo 'body<<TAG_NOTES_EOF'
            printf '%s\n' "$notes"
            echo 'TAG_NOTES_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Applied Factory ${{ github.ref_name }}
          body: ${{ steps.tag.outputs.body }}
          files: build/libs/*.jar
